version: 2

# repositories[]: id, responsibilities, sources
# systems[]: id, name, responsibilities, location, sources
# relationships[]: source, relation, target, contract, sources
# Version 2 заменяет неоднозначные поля from/to/type. Они недопустимы в новых
# записях и не должны автоматически интерпретироваться как source/target/relation.
#
# Каждая relationship читается как одно направленное утверждение:
#   <source> <relation> <target>
#
# source и target — только типизированные ссылки на существующие элементы карты:
#   system:<systems[].id>
#   repository:<repositories[].id>
# Не используйте свободные имена, пути checkout, названия каталогов или подписи UI.
#
# Допустимые relation и их направление:
#   implemented_by: system -> repository
#   depends_on:     system -> system; source зависит от target
#   calls:          system -> system; source инициирует вызов target
#   publishes_to:   system -> system; source публикует событие для target
#   verifies:       repository -> system
# Для calls и publishes_to указывайте contract. Если направление или relation не
# подтверждены, не создавайте связь — оставьте адресный TODO в 03-architecture.md.
# Связь системы с репозиторием храните только через implemented_by; не дублируйте её
# отдельным repositories[].systems.
#
# Пример:
# relationships:
#   - source: system:profile
#     relation: calls
#     target: system:contacts
#     contract: GET /contacts
#     sources:
#       - docs/architecture/profile.md:42
#
# При наличии openspec-orch.yaml repository id должны точно совпадать с его
# repositories[role=code]. Не копируйте сюда remote и default branch.
# Не копируйте сюда локальную структуру, технологии, конфигурацию, build/test-команды,
# CI и упаковку Code Repository.
# Добавляйте только подтверждённые репозитории, системы и связи; id уникальны внутри
# своей секции.

repositories: []
systems: []
relationships: []
