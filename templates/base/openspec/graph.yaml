version: 1

# Nodes are discovered from authoritative project files:
#   repository:<id>                 from openspec-orch.yaml roles: [code]
#   master-spec:<capability-path>    from openspec/specs/**/spec.md
#   delta-spec:<change-id>/<path>    from openspec/changes/**/specs/**/spec.md
#
# Allowed explicit relations:
#   repository -> repository:  depends_on, calls, publishes_to
#   master-spec -> repository: implemented_by
#   repository -> master-spec: verifies
#   master-spec -> master-spec: depends_on
#   delta-spec -> repository:  targets
#   delta-spec -> delta-spec:   depends_on
#
# Delta Spec -> Master Spec `changes` edges and ADDED/MODIFIED/REMOVED/RENAMED
# operations are derived automatically and must not be duplicated here.
# Every explicit edge requires at least one existing Store-relative path:line source.
# `calls` and `publishes_to` also require a named contract.
# Direction semantics:
#   source depends_on target      -> target change reviews source
#   source calls target           -> target contract change reviews source caller
#   source publishes_to target    -> topology only; no automatic impact or review

edges: []
