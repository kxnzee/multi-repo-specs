schema: base-v1

context: |
  Перед планированием прочитай openspec/context/00-start-here.md и только относящиеся
  к Change файлы долговечного контекста. Не переноси в Change неподтверждённые
  сведения из openspec/context/_raw/. Jira является источником запроса, а
  Requirements и Scenarios после принятия принадлежат OpenSpec. Если существует
  openspec-orch.yaml, прочитай repositories с `roles: [code]` и используй их точные
  id.
  Связи репозиториев, Master Specs и Delta Specs проверяй по валидированной модели
  обязательного OpenSpec Graph Plugin. Intent, Intake, Proposal, Requirements и
  Scenarios формируй без чтения Code Repository и CodeGraph. ЖЁСТКИЙ ЗАПРЕТ: Code
  Repository разрешено открывать только для подтверждения или опровержения заранее сформулированного
  current-state утверждения на Design-, Tasks- или Apply-стадии. Результат такой
  проверки является evidence текущей реализации, а не содержимым Planning-артефакта.
  Evidence, внутренние технические детали, code inventory и path:line не переносить в
  центральный Store; это относится к openspec/context/ и всем Change artifacts.
  Во время штатного Apply сначала используй project skill
  openspec-base-apply-context. Он выполняет общий Graph preflight и выбирает маршрут:
  без подключённого Change Tracking — standard OpenSpec mode, с подключённым Plugin —
  его установленный skill change-tracking-apply-context. Только plugin-owned skill
  проверяет Cycle, planning pin и repository-scoped Tasks; Base не дублирует эти
  правила. Встроенный openspec-apply-change остаётся владельцем workflow.

rules:
  intake:
    - "Каждый новый Change требует согласованного Intent. Если пользователь уже передал принятый Daily Intent Brief, Jira Story или другой источник с явными изменением, Why Now, ожидаемым улучшением, критериями успеха и ограничениями, использовать его без повторного запуска base-intent. Если такого Intent нет, остановиться до Intake и предложить base-intent либо передачу принятого источника; не придумывать Intent внутри Intake."
    - "Канонический пользовательский вход — project command /openspec-base-intake <change-id>. Независимо от способа запуска собирать intake до Proposal в диалоге по одному вопросу и самостоятельно переносить ответы в итоговый intake.md. Когда контекст позволяет честно вывести варианты, предлагать 2–4 коротких взаимоисключающих ответа с пояснением различий; решение всегда оставлять пользователю."
    - "Сначала перенести в Intake подтверждённые выводы согласованного Intent и уже переданных материалов, не копируя их механически и не задавая повторно закрытые ими вопросы. Номер или ссылка на Jira без доступного содержания является provenance, но не подтверждает Intent автоматически."
    - "Указать Jira Story или явно сообщить, что идентификатор исходной задачи не предоставлен; использовать только переданные материалы и относящийся к вопросу подтверждённый openspec/context. Не переносить неподтверждённый openspec/context/_raw/ как факт."
    - "Зафиксировать проблему или возможность, затронутых пользователей или операторов, Why Now, текущее и целевое наблюдаемое поведение, предварительный scope и Non-Goals, ограничения, критерии успеха, известные сценарии, системные взаимодействия, доступ, security, данные, ошибки, деградацию и ожидаемую проверку. Неприменимые части отмечать кратким обоснованием, а не выдумывать содержание."
    - "ЯВНО включить раздел Interaction Diagram. Для взаимодействия двух и более компонентов, внешней зависимости, асинхронного обмена либо значимых error/degraded веток привести PlantUML sequence diagram; иначе написать Not applicable и краткую причину."
    - "Завершить одним Planning Route: ready_for_proposal, explore_recommended или blocked. Для explore_recommended перечислить точные вопросы Explore, способные изменить scope, наблюдаемое поведение или системную границу; неизвестные детали реализации сами по себе не требуют Explore."
    - "В разделе Exploration использовать status not_required, pending или completed. После /opsx-explore обновить этот же intake.md, классифицировать findings как CONFIRMED, CONTRADICTED, UNKNOWN или MISSING и повторно выбрать Planning Route; не создавать отдельный exploration artifact и не переходить к Proposal автоматически."
    - "intake.md является входным контекстом и provenance, но не Requirement, Scenario, Design decision, ADR, принятым Repository Impact или evidence реализации. Во время Intake не читать Code Repository, CodeGraph, реализационные тесты или repository-specific configuration; отдельная просьба пользователя не меняет допустимые источники этого artifact. Не добавлять раздел Owner Confirmation и не создавать второй questionnaire-файл."
  proposal:
    - "Перед тем как считать Proposal завершённым, использовать project skill openspec-base-meta-planning для текущего Change и стадии proposal; устранить подтверждённые findings в текущем артефакте, а при needs_revision или blocked остановиться до исправления или решения владельца."
    - "Указать Jira Story или явно сообщить, что идентификатор исходной задачи не предоставлен."
    - "Сначала подтвердить продуктовую постановку: проблему или возможность, затронутых пользователей или операторов, текущее и целевое наблюдаемое поведение, доменные и бизнес-правила, scope, Non-Goals и критерии успеха. Для чисто технического Change вместо пользовательского сценария зафиксировать инженерную или эксплуатационную проблему и наблюдаемый результат."
    - "Сначала прочитать intake.md и переносить из него только подтверждённые выводы в границах Proposal, не копируя опросник целиком. Если обязательной информации для продуктовой постановки не хватает, задавать владельцу по одному отсутствующему вопросу и не завершать Proposal. Не читать Code Repository, CodeGraph, реализационные тесты или repository-specific configuration для создания Proposal; неизвестное текущее поведение уточнять у владельца либо оставлять открытым вопросом. Не создавать второй questionnaire-файл."
    - "Только после согласованной продуктовой постановки исследовать затронутые capability, системы, API или события, данные, security, совместимость, миграцию, rollout, rollback и проверку."
    - "Proposal описывает WHY и WHAT. Не включать внутренние имена файлов, классов и функций, построчные code evidence, предполагаемые точки реализации и выбранный технический способ. Принятые архитектурные решения относятся к Design, но внутренние детали текущего кода не переносятся ни в один артефакт центрального Store. Допустимо называть публичный контракт, систему или repository-id, когда это необходимо для границы Change."
    - "Перечислить каждую новую и изменяемую capability на её существующем вложенном пути domain/capability; не создавать versioned duplicate."
    - "Если наблюдаемое поведение не меняется, явно обосновать skip_specs; иначе для каждой capability требуется Delta Spec."
    - "ЖЁСТКИЙ ЗАПРЕТ ДЛЯ REPOSITORY IMPACT: включать ТОЛЬКО Code Repositories, где из-за Change ожидается изменение кода, тестов, конфигурации или документации. Для каждого ОБЯЗАТЕЛЬНО указать точный repository-id, тип влияния, ожидаемый результат на границе и причину из принятого intent, Master Specs, OpenSpec Graph, подтверждённого context или решения владельца. ЗАПРЕЩЕНО перечислять весь Repository registry, соседей Graph, review-only или неизменяемые репозитории и создавать строки no-change. При сомнении НЕ добавлять Repository и вернуть открытый вопрос владельцу. До Delta Specs не считать набор Cycle scope и не подтверждать его чтением кода."
  specs:
    - "Перед тем как считать Delta Specs завершёнными, использовать project skill openspec-base-meta-planning для текущего Change и стадии specs; отсутствие ещё не созданных Design и Tasks не считать ошибкой этой промежуточной проверки."
    - "Перед записью Specs прочитать intake.md и proposal.md. Каждому подтверждённому предварительному сценарию, правилу доступа, error/degraded case, data/security constraint и публичному взаимодействию из Intake дать явный результат: наблюдаемое нормативное поведение покрыть Requirement и Scenario соответствующей capability; техническую деталь, Non-Goal или открытый вопрос оставить в своей границе. Не терять подтверждённый пункт молча и не повышать assumption/unknown до Requirement."
    - "Создавать один Delta Spec на каждую capability из Proposal и сохранять существующий вложенный capability path."
    - "Каждому новому Scenario присваивать стабильный ID в заголовке формата `<change-id>-<index>`, например `#### Scenario: Контакты доступны владельцу — add-profile-contacts-001`. Использовать точный `change-id`, а трёхзначный index увеличивать последовательно и не переиспользовать внутри Change. После создания не переименовывать ID, включая перенос Scenario в Master Spec и последующие Changes."
    - "В MODIFIED переносить полный Requirement и все сохраняемые Scenarios вместе с их существующими ID."
    - "Не делить Requirements и Scenarios по репозиториям: Specs описывают наблюдаемое поведение, а размещение реализации относится к Proposal, Design и Tasks."
    - "ЖЁСТКИЙ ЗАПРЕТ ДЛЯ SPECS: писать ТОЛЬКО наблюдаемое поведение, доменные правила и принятые публичные контракты. ЗАПРЕЩЕНО указывать внутренние файлы, классы, функции, модули, библиотеки, таблицы хранения, локальную конфигурацию, команды или точки реализации Code Repository. Такие детали НИКОГДА не являются Requirement, даже если обнаружены при сверке с текущим кодом; удалить их и вернуть BLOCKER до исправления."
    - "Не читать Code Repository, CodeGraph или реализационные тесты при создании и проверке Requirements и Scenarios. После записи Delta Specs выполнить openspec-orch graph build, затем graph status --json и продолжить только при state ready."
  design:
    - "Перед тем как считать Design завершённым, использовать project skill openspec-base-meta-planning для текущего Change и стадии design; проверять только применимые архитектурные риски и подтверждать repository-specific выводы evidence."
    - "Связать каждое техническое решение с Requirement, Scenario или явным ограничением Proposal и указать его влияние на наблюдаемое поведение. Design не создаёт новые требования: если исследование выявило необходимость нового или изменённого поведения, остановиться и вернуть Change к уточнению Proposal и Specs."
    - "Для применимых изменений описать границы систем, контракты, данные, security, совместимость, миграцию, rollout, наблюдение и rollback; неприменимые разделы не заполнять формально."
    - "Добавить Repository implementation map только для repository-id из Repository impact: по каждому описать его часть решения, изменяемые границы, входящие и исходящие контракты, зависимости и порядок реализации. Не добавлять review-only или неизменяемый Repository и не смешивать evidence разных репозиториев."
    - "Code Repository разрешено использовать ТОЛЬКО для проверки current state, совместимости или реализуемости решения. В Design ОБЯЗАТЕЛЬНО фиксировать решение на уровне системных границ и публичных контрактов. ЗАПРЕЩЕНО переносить path:line, имена внутренних файлов, классов, функций, модулей, таблиц, библиотек, локальной конфигурации и code inventory; при обнаружении удалить их и вернуть BLOCKER."
  tasks:
    - "Перед тем как считать Tasks завершёнными, использовать project skill openspec-base-meta-planning для текущего Change и стадии tasks; проверить трассировку Scenario → Design decision → Task и план evidence."
    - "Связать каждую задачу реализации и проверки с Requirement или Scenario ID, Design decision либо явным ограничением Proposal. Задача не должна добавлять поведение или расширять scope, которого нет в принятых Planning-артефактах."
    - "Для пользовательского или системного поведения указать проверку наблюдаемого результата, а не только факт изменения кода или прохождения изолированного unit-теста."
    - "Включить подготовку evidence для PR Review, IFT и QA. Завершить tasks.md ровно одной общей numbered section `Проверка реализованного изменения` с одним checkbox: `Получить подтверждение, что текущая версия изменения успешно проверена в целевом окружении по принятым сценариям, а все блокирующие дефекты устранены и повторно проверены.` Указать подтверждённого ответственного участника. Это внешний checkpoint: не отмечать его выполненным заранее или только на основании вывода агента; новая версия или новый deployment после подтверждения снова делают его незавершённым до повторной проверки."
    - "Группировать задачи в sections, заголовок которых содержит точный repository-id из Repository impact. Не создавать repository section без планируемого изменения в этом Repository. Межрепозиторные и общие проверки выделять отдельно и указывать owner; если owner не указан, им считается однозначный primary solution owner из Repository implementation map Design. Не использовать условные backend/frontend вместо зарегистрированного id."
    - "Task ОБЯЗАН описывать требуемый результат, публичную границу и способ проверки, а не навигацию по текущему коду. ЗАПРЕЩЕНО включать в Tasks внутренние paths, symbols, модули, таблицы, локальные config keys, команды сборки или выбранные библиотеки из Code Repository. Эти детали определяются ТОЛЬКО во время Apply по repository-local evidence; при нарушении вернуть BLOCKER."

operations:
  archive:
    guidance:
      - "До Archive потребовать завершённый финальный checkbox section `Проверка реализованного изменения` в tasks.md. Он может быть отмечен только после явного подтверждения ответственного участника для текущей версии изменения; отсутствие подтверждения, открытые блокирующие дефекты либо новая непроверенная версия блокируют Archive. Не создавать отдельный verification artifact и не дублировать внешние test cases или execution history в Change."
      - "До синхронизации Delta Specs и перемещения Change выполнить openspec-orch graph status --json. Если состояние не ready, выполнить openspec-orch graph build и повторить status; отсутствие binding либо неуспешный build блокирует Archive. Не редактировать openspec/graph.yaml автоматически как часть Archive."
      - "На свежем индексе выполнить openspec-orch graph impact <change-id>. Проверить prerequisite_changes.direct и prerequisite_changes.transitive и не архивировать Change раньше активных Changes, от которых он зависит; dependent_changes использовать для проверки активных потребителей текущего Change."
      - "Если Change Tracking объявлен и подключён для Store, выполнить openspec-orch status <change-id> --json. При Cycle передать каждый точный repository-id из repositories отдельным --repo в openspec-orch graph check-scope <change-id>; при CYCLE_NOT_FOUND использовать точные repository-id принятых Tasks sections, предусматривающих работу в Code Repository; любая другая ошибка status блокирует Archive. Если Change Tracking не подключён, не вызывать его команды и использовать те же принятые Tasks sections. Для явно принятого skip_specs без Delta Specs зафиксировать scope_check: not_applicable и проверить repository sections напрямую, не создавать фиктивный Delta Spec."
      - "До Archive устранить invalid scope, missing_required_repositories, missing_delta_specs для Change без принятого skip_specs, unmapped_master_specs, included_review_repositories и extra_repositories. review_repositories_outside_scope проверить как диагностические кандидаты: если проверка обнаружила реальное изменение, вернуть Change в Planning и добавить Repository; если изменения нет, не добавлять Repository в Impact/Cycle и не создавать no-change artifact."
      - "После успешного Archive снова выполнить openspec-orch graph build, потребовать graph status --json со state ready и проверить graph impact <change-id> уже для архивного Change. Не откатывать штатный Archive автоматически при ошибке post-build, но явно считать Graph handoff незавершённым до исправления и успешной пересборки."
      - "После успешного Graph handoff не изменять openspec/context или ADR автоматически. Если пользователь запросил актуализацию либо Change содержит кандидат на долговечный domain/architecture/security context, предложить /openspec-base-context audit --change <change-id>; при необходимости пользователь может передать точные --spec/--domain. Этот audit и его proposed diff не блокируют Archive и не изменяют Master Specs."
