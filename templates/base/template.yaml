agents:
  qwen:
    openspec_adapter: qwen
    generated_directory: .qwen
    target_directory: .qwen
    commands_directory: .qwen/commands
    instructions_file: QWEN.md
    copy:
      - from: assets/gitignore.template
        to: .gitignore
      - from: openspec/config.yaml
        to: openspec/config.yaml
      - from: context
        to: openspec/context
      - from: skills
        to: .qwen/skills
      - from: subagents
        to: .qwen/agents
      - from: agents/qwen
        to: .

  gigacode:
    openspec_adapter: qwen
    generated_directory: .qwen
    target_directory: .gigacode
    commands_directory: .gigacode/commands
    instructions_file: .gigacode/GIGACODE.md
    copy:
      - from: assets/gitignore.template
        to: .gitignore
      - from: openspec/config.yaml
        to: openspec/config.yaml
      - from: context
        to: openspec/context
      - from: skills
        to: .gigacode/skills
      - from: subagents
        to: .gigacode/agents
      - from: agents/gigacode
        to: .
