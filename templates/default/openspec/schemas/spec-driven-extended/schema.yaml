name: spec-driven-extended
version: 1
description: Extended spec-driven workflow - intake → proposal → specs/design → tasks → verify
artifacts:
  - id: intake
    generates: intake.md
    description: Confirmed source context and planning route for the change
    template: intake.md
    instruction: |
      Create the intake document before Proposal to preserve the confirmed source
      context of this Change and make the next planning decision explicit.

      Use the current Intake template as the single source for document sections,
      readability, applicability and source-provenance rules. Read and apply its
      authoring guidance before saving or revising intake.md.

      A new Change requires an agreed Intent. Use an accepted Daily Intent Brief,
      Jira Story, or another user-confirmed source when it explicitly provides the
      intended change, Why Now, expected improvement, success criteria, and
      constraints. Do not require spec-driven-extended-intent to run again when this source already
      exists. If it does not exist, stop before Intake and ask the user to establish
      or supply the Intent; do not invent it inside this artifact.

      Conduct a focused dialogue rather than dumping a static checklist:
      - ask one missing question at a time;
      - preload confirmed Intent conclusions and supplied answers, and never ask the
        user to repeat information they already establish;
      - when the available context supports honest alternatives, offer 2-4 concise
        mutually exclusive options and allow the user to refine or reject them;
      - distinguish confirmed facts, assumptions, conflicts, and open questions;
      - preserve the scope of negative statements: "outside this Change" does not
        establish absence from the product or make security/audit unnecessary;
      - do not read Code Repositories, implementation tests, or
        repository-specific configuration during Intake. A separate user request
        does not change the allowed sources of this artifact;
      - do not create the file until the intake is complete enough for the user to
        choose the next route.

      For explore_recommended, keep "Результаты исследования" pending with exact
      researchable questions. When Explore results are supplied, classify findings
      as CONFIRMED, CONTRADICTED, UNKNOWN, or MISSING, update this same intake.md,
      and reassess the Planning Route. Do not create a second questionnaire or
      exploration artifact and do not continue to Proposal automatically.

      Before finishing Intake, including after Explore or a repeated interview,
      invoke spec-driven-extended-reconcile. Do not advance automatically.

      intake.md is planning input with historical provenance, not an accepted
      Requirement, Scenario, Design decision, ADR, repository scope, or proof of
      implementation. Proposal and later artifacts must promote only confirmed
      conclusions into their proper normative boundaries. Do not add an Owner
      Confirmation section.
    requires: []

  - id: proposal
    generates: proposal.md
    description: Initial proposal document outlining the change
    template: proposal.md
    instruction: |
      Use accepted planning sources and normative Store artifacts for this stage.
      Do not inspect Code Repositories to formulate Proposal, Requirements or Scenarios.
      Create the proposal document that establishes WHY this change is needed.
      Read intake.md first, resolve or preserve its relevant open questions, and
      promote only confirmed conclusions without copying the questionnaire verbatim.
      Before completion invoke spec-driven-extended-reconcile. Then invoke
      spec-driven-extended-meta-planning for the proposal stage and
      resolve its findings. Include a Repository Impact table containing only exact
      registered Code Repository IDs and capability paths expected to change.

      Sections:
      - **Why**: 1-2 sentences on the problem or opportunity. What problem does this solve? Why now?
      - **What Changes**: Bullet list of changes. Be specific about new capabilities, modifications, or removals. Mark breaking changes with **BREAKING**.
      - **Capabilities**: Identify which specs will be created or modified:
        - **New Capabilities**: List capabilities being introduced. Each becomes a new `specs/<capability-path>/spec.md`. Use kebab-case for path segments you introduce (e.g., `user-auth` or `identity/user-auth`) and follow the project's existing spec organization.
        - **Modified Capabilities**: List existing capabilities whose REQUIREMENTS are changing. Only include if spec-level behavior changes (not just implementation details). Each needs a delta spec file. Use the exact existing path under `openspec/specs/`. Leave empty if no requirement changes.
      - **Impact**: Affected code, APIs, dependencies, or systems.

      IMPORTANT: The Capabilities section is critical. It creates the contract between
      proposal and specs phases. Research existing specs before filling this in.
      Each capability listed here will need a corresponding spec file.

      Every change must either declare at least one capability (new or
      modified) or explicitly opt out of specs: `openspec validate` rejects a
      change with zero deltas unless the change's `.openspec.yaml` sets
      `skip_specs: true`. Use `skip_specs: true` only when no spec-level
      behavior changes (pure refactor, tooling, docs) - specs describe
      behavior, so if behavior does not change, no spec should change either.
      Do not invent a requirement just to satisfy validation.

      Keep it concise (1-2 pages). Focus on the "why" not the "how" -
      architectural decisions and public interaction contracts belong in design.md.

      This is the foundation - specs, design, and tasks all build on this.
    requires:
      - intake

  - id: specs
    generates: "specs/**/*.md"
    description: Detailed specifications for the change
    template: spec.md
    instruction: |
      Use accepted planning sources and normative Store artifacts for this stage.
      Do not inspect Code Repositories to formulate Proposal, Requirements or Scenarios.
      Create specification files that define WHAT the system should do.
      Before completion invoke spec-driven-extended-reconcile. Then invoke
      spec-driven-extended-meta-planning for the specs stage.

      Read intake.md and proposal.md before writing Delta Specs. For every confirmed
      preliminary scenario, access rule, failure/degraded case, data/security
      constraint, and public interaction in Intake, decide explicitly whether it is
      observable normative behavior. If it is, cover it with a Requirement and
      Scenario in the appropriate capability. If it is not, keep it in its proper
      Proposal/Design/open-question boundary. Never silently drop a confirmed Intake
      item and never promote an assumption or unknown into a Requirement.

      A spec is a behavior contract, not an implementation plan.

      Good spec content:
      - Observable behavior users or downstream systems rely on
      - Inputs, outputs, and error conditions
      - External constraints (security, privacy, reliability, compatibility)
      - Scenarios that can be tested or explicitly validated

      Avoid in specs:
      - Internal class/function names
      - Library or framework choices
      - Step-by-step implementation details
      - Detailed execution plans (those belong in design.md or tasks.md)

      Quick test: if the implementation can change without changing externally
      visible behavior, it likely does not belong in the spec.

      Create one spec file per capability listed in the proposal's Capabilities section.
      `<capability-path>` is the spec directory relative to `specs/` (for example,
      `user-auth` or `identity/user-auth`). Preserve the full path:
      - New capabilities: use the exact path from the proposal at `specs/<capability-path>/spec.md`. Any path segment newly introduced in the proposal must be kebab-case. Follow the project's existing organization; do not add a new domain level when the project uses a flat layout.
      - Modified capabilities: use the exact existing path from `openspec/specs/<capability-path>/` when creating the delta at `specs/<capability-path>/spec.md`. Do not move or rename the capability.

      There must be at least one spec file unless the change's `.openspec.yaml`
      sets `skip_specs: true` (no spec-level behavior change) - `openspec validate`
      rejects a zero-delta change without that marker. If the proposal lists no
      capabilities and `skip_specs` is not set, revisit the proposal first.

      Delta operations (use ## headers):
      - **ADDED Requirements**: New capabilities
      - **MODIFIED Requirements**: Changed behavior - MUST include full updated content
      - **REMOVED Requirements**: Deprecated features - MUST include **Reason** and **Migration**
      - **RENAMED Requirements**: Name changes only - use FROM:/TO: format

      Format requirements:
      - Each requirement: `### Requirement: <name>` followed by description
      - Use SHALL/MUST for normative requirements (avoid should/may)
      - Each scenario: `#### Scenario: <name>` with WHEN/THEN format
      - Give every new Scenario a stable `<change-id>-<three-digit-index>` suffix
      - **CRITICAL**: Scenarios MUST use exactly 4 hashtags (`####`). Using 3 hashtags or bullets will fail silently.
      - Every requirement MUST have at least one scenario.

      New capabilities only: start the delta spec with a `## Purpose` section -
      one or two sentences (50+ characters, or `openspec validate --strict`
      reports it as too brief) describing what the capability is for. Archive
      copies it into the main spec it creates; without it the new main spec is
      left with a `TBD ... Update Purpose after archive` placeholder to fill in
      by hand. Do NOT add `## Purpose` to a delta for an existing capability -
      that spec already has one and the delta's is ignored. If an existing
      capability's Purpose is missing, still contains a `TBD` placeholder, or
      must change, stop and return a blocker to the Spec Owner. Do not edit a
      Master Spec directly from this Change; its correction requires a separate
      accepted Store operation under the project's Master Spec rules.

      MODIFIED requirements workflow:
      1. Locate the existing requirement in `<planningHome.root>/openspec/specs/<capability-path>/spec.md` (the same store-aware root as above)
      2. Copy the ENTIRE requirement block (from `### Requirement:` through all scenarios)
      3. Paste under `## MODIFIED Requirements` and edit to reflect new behavior
      4. Ensure header text matches exactly (whitespace-insensitive)

      Common pitfall: Using MODIFIED with partial content loses detail at archive time.
      If adding new concerns without changing existing behavior, use ADDED instead.

      Example (a new capability, so it opens with `## Purpose`):
      ```
      ## Purpose

      Lets users take their data out of the product in a portable format.

      ## ADDED Requirements

      ### Requirement: User can export data
      The system SHALL allow users to export their data in CSV format.

      #### Scenario: Successful export — <change-id>-001
      - **WHEN** user clicks "Export" button
      - **THEN** system downloads a CSV file with all user data

      ## REMOVED Requirements

      ### Requirement: Legacy export
      **Reason**: Replaced by new export system
      **Migration**: Use new export endpoint at /api/v2/export
      ```

      Specs should be testable - each scenario is a potential test case.
    requires:
      - proposal

  - id: design
    generates: design.md
    description: Architecture, public interaction contracts and technical decisions
    template: design.md
    instruction: |
      Read the current Design template from these instructions before investigation
      or writing. It is the single source for document sections, allowed content,
      public-contract completeness and review criteria. Prepare design.md from it.
      Design is required before Tasks; scale its detail to the Change.

      Before completion invoke spec-driven-extended-reconcile with the Design findings,
      then spec-driven-extended-meta-planning for the design stage against the current
      template. Resolve blockers and repeat only affected checks after edits.
      If either check is unavailable, interrupted or incomplete, report the stage as
      unfinished and stop before Tasks. An existing file or OpenSpec status of done
      is not proof that review completed. Do not create a separate review artifact.
    requires:
      - proposal

  - id: tasks
    generates: tasks.md
    description: Implementation checklist with a final verification checkpoint
    template: tasks.md
    instruction: |
      The project-designated Planning owner creates the task list that breaks down the implementation work.
      Before completion invoke spec-driven-extended-reconcile with the planning findings.
      Then invoke spec-driven-extended-meta-planning for the tasks stage and
      verify Scenario → Design decision → Task traceability.

      Use only explicitly provided project roles, reviewers and delivery rules.
      Do not infer them from job titles, repository layout or external systems.

      Before writing tasks, check design.md for Open Questions. If any of them
      would change what gets built, resolve them with the user first - do not
      bake an unstated assumption into the task list.

      **IMPORTANT: Follow the template below exactly.** The apply phase parses
      checkbox format to track progress. Tasks not using `- [ ]` won't be tracked.

      Guidelines:
      - Group related tasks under ## numbered headings
      - Each task MUST be a checkbox: `- [ ] X.Y Task description`
      - Implementation tasks should be small enough to complete in one session
      - Order tasks by dependency (what must be done first?)
      - Each implementation task MUST state how to verify completion (a test,
        command, observable behavior, or delivered artifact). Put that check in
        the task's checkbox description. Add any other separate verification task
        only when it checks broader integration or system behavior that spans
        multiple implementation tasks.
      - Keep Tasks implementation-only. Human Feature Acceptance belongs to the
        following Verify artifact.

      Example:
      ```
      ## 1. `<repository-id>`

      - [ ] 1.1 Prepare the repository for the accepted change and verify its setup
      - [ ] 1.2 Configure required dependencies and verify reproducible setup succeeds

      ## 2. `<other-repository-id>`

      - [ ] 2.1 Implement data export function and verify the export test passes
      - [ ] 2.2 Support required CSV formatting and verify quoting and delimiters
      ```

      Reference specs for what needs to be built, design for how to build it.
      After writing Tasks, refresh get_next_action and hand off to Apply when its
      prerequisites are complete. Do not suggest or create verify.md from Planning,
      even if OpenSpec reports it ready. Continue/Fast-forward must stop at Apply.
    requires:
      - specs
      - design

  - id: verify
    generates: verify.md
    description: Universal human Feature Acceptance after implementation
    template: verify.md
    instruction: |
      Create a concise verification handoff for a human, not an Agent execution log.
      Start with the template's short Agent summary, then account for every Scenario
      in the accepted Specs. Turn each Scenario into reproducible manual steps and an
      observable expected result. For UI, API or database behavior name the entry
      point, required data, actions and state the verifier should observe. Keep the
      human result PENDING until a person performs or explicitly accepts that case.

      Reference the candidate once through its canonical local implementation record.
      The canonical implementation record owns candidate revisions, provider URLs and
      checkout resolution. verify.md must not copy commit hashes, revisions or PR/CI
      URLs from that record. Evidence must be usable from the checked-out Store and
      candidate checkouts. Name repository_id and repository-relative paths to the
      result, test or report. If the canonical record
      cannot resolve the candidate, report BLOCKED instead of reconstructing it from
      provider data. Never require GitHub, GitLab or Bitbucket API/MCP access to
      understand the candidate or reproduce a check.
      Do not repeat commit lists, branch history, timestamps, raw command output,
      API payloads, tool transcripts or Agent reasoning in verify.md. If Delta Specs
      are intentionally absent, derive a
      small set of non-normative Acceptance cases from accepted Proposal success
      criteria; never substitute Tasks, Design details or Git history for user-facing
      verification cases.

      PASS requires executed evidence of expected behavior; violations are FAIL,
      missing or stale evidence is PENDING, and N/A requires justified inapplicability.
      Reconcile the full Scenario list before acceptance; omissions cannot pass.
      Include cross-repository interactions when required by the accepted scenarios.
      Planning review alone cannot establish delivered Scenario PASS. Preserve the
      schema's lifecycle and the project's human acceptance rules.
      Write verify.md in Russian using the template's Russian headings. Preserve
      command syntax, identifiers, status values and the contract markers.
      Treat this artifact as a separate post-implementation gate: its availability in
      the artifact graph is not proof that an Apply candidate exists and can never
      justify PASS by itself.

      Before creating or updating verify.md, including from Continue/Fast-forward,
      read current Apply instructions. Require state: all_done with a positive task
      total, complete equal to total and remaining: 0, plus an actual implementation
      candidate and executed Apply checks. Completed checkboxes alone are not evidence.
      If tasks are pending or reopened, return to Apply. If progress or the candidate
      is unknown, resolve that uncertainty first. Do not create an empty or PENDING
      Verify placeholder before Apply completes; preserve any existing file without
      treating it as proof of completion. After Apply, collect current evidence and
      keep the human decision PENDING until explicitly made.

      Before completing Verify invoke spec-driven-extended-reconcile with its findings.

      Invoke **openspec-verify-change**, then fill the shared Feature Acceptance
      scenario table and concise automatic-check table.
      Run `openspec validate <change-name> --strict --no-interactive` for this candidate
      from the Store and record only its status plus a durable evidence link. Keep human decisions and
      future Archive/UAT/Release actions outside executed evidence. Use
      `N/A` only with a reason and `PENDING` for an applicable check that was not run.
      Present that evidence for an explicit human decision. The Agent must keep the
      Human gate `PENDING` until a person explicitly selects `PASS` or
      `FAIL`; Agent evidence cannot make this decision. After implementation changes,
      collect current evidence and obtain a new decision. Verify does not perform
      Archive, UAT or Release. Human Feature Acceptance `PASS` is required before the
      team archives the Change through a Store PR. Process Compliance for
      `spec-driven-extended` is NOT_APPLICABLE.
    requires:
      - tasks

apply:
  requires: [tasks]
  tracks: tasks.md
  instruction: |
    Before any implementation edit, invoke the installed spec-driven-extended-apply-context
    skill through the Agent's skill mechanism and require its apply_scope.scope_status:
    ready for this Change and Repository. Reading these instructions or calling tracking
    does not execute the helper. If unavailable or blocked, stop before editing code.
    Return from the helper to this Apply without recursive invocation, then read context
    files, work through pending tasks and mark complete as you go. Apply does not create a separate receipt artifact.
    Перед checkbox сформировать:

    Для task_id используй точный `id` выбранной задачи из
    `artifact_instructions.tasks` актуального Apply-контекста. Номер `1.1` или `2.3`
    в начале description служит подписью в документе и может отличаться от ID OpenSpec.
    Сопоставляй полное описание и repository section; не вычисляй индекс самостоятельно.

    ~~~yaml
    task_evidence:
      task_id: <id>
      claim: <проверяемый результат>
      artifacts: []
      checks: []
      status: satisfied | blocked
    ~~~

    Отмечать Task только при `satisfied`:

    - artifacts непосредственно подтверждают результат;
    - реально выполненные checks перечислены с результатом;
    - требуемый тест существует, проверяет заявленное поведение и прошёл;
    - coverage сопоставлено с принятым контрактом независимо от списка написанных
      тестов: проверены допустимые значения, default/отсутствие и значимые классы
      недопустимых входов. «Любое другое значение» требует проверки типов, а не только
      одного неизвестного литерала; для lookup/coercion проверь унаследованные имена,
      массивы и объекты с преобразованием, если они входят в домен входов контракта;
    - межрепозиторная проверка покрывает согласованные варианты публичного обмена,
      включая default, а утверждения «без преобразования»/«не выбрасывает» подтверждены
      поведением на соответствующих входах. Зелёные тесты сами по себе не доказывают
      полноту; отсутствующий accepted contract не дополняется выдуманным требованием;
    - план проверки или рассуждение не выдаются за выполненную verification.

    После `satisfied` запиши progress по правилам этого Apply. Blocked Task остаётся
    незакрытой; принятые описания задач не меняются.
    Находки, меняющие ранние артефакты, передай в spec-driven-extended-reconcile.
    После возврата из Planning заново выполни Apply preflight.

    После repository scope:

    ~~~yaml
    repository_completion:
      repository: <repository-id>
      satisfied_tasks: []
      blocked_tasks: []
      checks: []
      completion_status: completed | incomplete
    ~~~

    Не объявлять весь Change реализованным по завершению одного Repository.

    Resolve exactly one existing Store task file from contextFiles.tasks; stop if
    its identity is ambiguous. After verifying the selected task's result, update
    only its checkbox using the Agent's file editor. Match the task to its full
    description and repository section. A Store coordinator may record verified
    Code Repository results without treating Store as an implementation repository.
    Pending or blocked tasks remain unchecked. Re-read before editing, preserve task
    descriptions, numbering and unrelated changes, verify the diff and refresh context.
    Report access failures with the exact path and verified results for handoff,
    without claiming progress was saved or creating a second tasks.md. Do not bypass
    environment restrictions, change accepted Planning or commit/publish implicitly.
    Pause if you hit blockers or need clarification. Human Feature Acceptance belongs
    to the following Verify artifact, not to implementation Tasks.
    At each task completion and before ending Apply invoke spec-driven-extended-reconcile.
