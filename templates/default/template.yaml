id: default
name: Default Project Template
agentInstructions: assets/agent-instructions.md
requires:
  extensions:
    - spec-driven-extended
    - superpowers
copy:
  - from: assets/STORE.md
    to: STORE.md
  - from: context
    to: openspec/context
  - from: process
    to: openspec/process
  - from: openspec/config.yaml
    to: openspec/config.yaml
  - from: openspec/schemas
    to: openspec/schemas
  - from: assets/gitignore.template
    to: .gitignore
