id: default
name: Default Project Template
requires:
  extensions:
    - openspec-base
    - superpowers
copy:
  - from: context
    to: openspec/context
  - from: openspec/config.yaml
    to: openspec/config.yaml
  - from: openspec/schemas
    to: openspec/schemas
  - from: assets/gitignore.template
    to: .gitignore
