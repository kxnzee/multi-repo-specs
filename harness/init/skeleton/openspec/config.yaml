schema: spec-driven

context: |
  Новые текстовые OpenSpec-артефакты и ответы при их подготовке пиши на русском языке.
  Не переводи код, команды, пути, идентификаторы и обязательные машинные значения.
  Перед созданием артефакта прочитай openspec/context/00-start-here.md
  и загрузи только назначенные им файлы для текущего артефакта.
  Бизнесовые спецификации нескольких Code Repositories находятся в центральном Store Repository.
  Requirements описывают наблюдаемое поведение без деталей реализации.
  Устройство кода и устойчивые технические знания принадлежат файлу инструкций
  соответствующего Code Repository и не копируются в центральные Specs.
  Используй штатный инструмент subagents для read-only Repository Context Pass, когда
  для текущего артефакта требуется технический контекст нескольких Code Repositories
  или одного крупного, независимая проверка вывода, разрешение противоречия либо
  исследование дополнительного зарегистрированного repository-id в прежнем бизнесовом scope.
  Перед запуском используй доступные project-level native subagents выбранного runtime и подбери
  специализацию по её `description`, только если она соответствует подтверждённой ответственности
  репозитория и текущему вопросу. Не определяй специализацию по имени repository-id и не поддерживай
  фиксированный список optional subagents. Если подходящей специализации нет или выбор неоднозначен,
  используй обязательный базовый subagent type `repository-context-pass`.
  Перед каждым pass основной агент проверяет role: code, чистоту checkout и точную 40-символьную
  Git revision. Прочитай agent.instructions_file из проверенного openspec-orch.yaml и сформируй абсолютный
  repository_instructions_path относительно checkout. Путь должен оставаться внутри checkout;
  если файл существует, его разрешённый путь также должен оставаться внутри checkout, а последний
  сегмент не должен быть symlink. Не ищи другой файл инструкций в commands, skills или agents.
  Передай subagent полный автономный prompt: change_id, artifact, repository_id, checkout,
  repository_instructions_path, revision, один question, business_boundaries и system_context.
  Не создавай артефакт до получения и проверки repository_id, revision, question и evidence
  всех нужных результатов. При конфликте запускай только узкий follow-up. Если runtime не
  поддерживает native subagents, не объявляй контекст изолированным и выполни один ограниченный
  pass в основном контексте только когда это безопасно для его размера.
  Единственный основной агент создаёт и изменяет артефакты Change.
  По умолчанию Master Specs меняются командой Archive на этапе Finalization.
  Change B, зависящий от активного Change A, планируй только после синхронизации принятой
  Delta Specs A с Master Specs стандартной командой /opsx-sync. После Sync Change A
  остаётся активным до Archive.

rules:
  proposal:
    - Укажи Jira/SberTrack key, проблему, ожидаемую ценность, границы изменения и риски совместимости.
    - Если Change зависит от поведения активного Change, начинай его только после merge Sync PR источника и укажи в Proposal исходный Change и ссылку на его Sync PR.
    - "Перед классификацией capabilities проверь Master Specs: каждую существующую capability укажи точным путём в Modified Capabilities; не создавай новое или версионированное имя для замены действующего контракта. Один Change может перечислять несколько capabilities только для одной общей бизнес-цели. При неоднозначности запроси решение Change Owner."
    - Перечисли Store, Code Repositories, известные по итогам Explore как кандидаты по repository-id из openspec-orch.yaml, и внешние системы; окончательный технический impact репозиториев определяется в design.md.
    - Во всех разделах Proposal, кроме явно отделённого evidence, описывай только наблюдаемое поведение, ценность и бизнесовые либо межсистемные границы. Не фиксируй названия файлов, каталогов, классов, функций, хуков, внутренних модулей, библиотек, команд, технологий, алгоритмы и локальные способы реализации.
    - Технические идентификаторы допустимы только в разделе источников как evidence с точной ревизией и не являются принятым решением. Отрицательный результат поиска формулируй только как ограниченное наблюдение Explore, а не как доказательство отсутствия. Открытые вопросы оставляй только для неразрешённого поведения или scope; не включай служебные действия OpenSpec и не создавай раздел, если вопросов нет.
  specs:
    - Описывай единый межрепозиторный контракт через наблюдаемые Requirements и Scenarios без деталей реализации.
    - Для зависимого Change используй актуальные Master Specs после merge Sync PR источника и описывай только собственную дельту, не копируя Delta Specs исходного Change.
    - Создай отдельную Delta Spec для каждой capability из Proposal и сохрани её относительный, в том числе вложенный, capability path. Для существующей capability выбирай ADDED, MODIFIED, REMOVED или RENAMED сравнением подтверждённого поведения с Master Spec; для новой используй Purpose и ADDED Requirements. В результате перечисли найденные capabilities, Requirements и операции; только при неоднозначности остановись до записи и запроси решение Change Owner.
    - MODIFIED без переименования должен сохранять точное имя Requirement и содержать его полную новую версию со всеми актуальными Scenarios. RENAMED применяй только к смене имени; изменение поведения вместе с переименованием оформляй RENAMED и полным MODIFIED под новым именем.
    - Не упоминай файлы, классы, функции, хуки, внутренние модули, библиотеки и локальные шаги реализации.
    - Каждый Requirement и Scenario должен прямо следовать из подтверждённого Proposal и не противоречить друг другу. Не добавляй новые наблюдаемые состояния, значения, внешние системы или scope; если они необходимы, останови создание Specs и верни решение Change Owner на шаг Proposal.
  design:
    - В командном процессе design.md обязателен для каждого Change.
    - Для зависимого Change укажи исходный Change и его Sync PR, интеграционный контракт, совместимость, порядок поставки и поведение при недоступности зависимости.
    - Фиксируй только межсистемный уровень — ответственность систем и repository-id, интеграции, контракты интерфейсов, владение данными, совместимость и миграцию.
    - Перечисли окончательный технический impact по repository-id и точным ревизиям всех исследованных checkout.
    - Опиши безопасный порядок слияния и развёртывания, наблюдение и стратегию отката.
    - Не копируй локальное устройство Code Repository и не указывай файлы, классы, функции, хуки, внутренние модули и конкретные библиотеки; сначала используй точный repository_instructions_path.
    - Отсутствие или неполнота файла инструкций Code Repository не блокируют Change; адресно исследуй исходный код на зафиксированной ревизии только по вопросам текущего изменения и никогда не загружай репозиторий целиком.
    - Считай блокирующим только конкретный неразрешённый факт, без которого нельзя достоверно определить межсистемный контракт, совместимость или безопасную поставку.
    - При Repository Context Pass сначала потребуй прочитать существующий repository_instructions_path, затем адресно читать код; переноси в design.md только относящийся к Change межсистемный результат.
    - Считай репозитории Proposal кандидатами. Если subagent обнаружил дополнительный зарегистрированный repository-id с чистым checkout того же Store без изменения бизнесовых capabilities, поведения, внешних систем и scope, выполни для него отдельный pass и добавь межсистемный impact и точную ревизию в design.md без возврата в Explore.
  tasks:
    - Раздели работу на проверяемые Work Packages уровня OpenSpec Store, отдельных repository-id и межрепозиторной интеграции.
    - Представь каждый Work Package отдельным стандартным checkbox tasks.md и явно укажи одну из целей — store, конкретный repository-id либо composite-verification.
    - Для передачи реализации используй только task.id из структурированного ответа openspec instructions apply на принятом Spec Baseline; не создавай собственный формат ID и не извлекай ID из текста checkbox.
    - Включи строгую валидацию OpenSpec, компонентные и контрактные проверки, composite verification и условия Archive.
    - Описывай результат, зависимости и проверку пакета, но не файлы, классы, функции и локальные implementation steps; они принадлежат implementation PR Code Repository.
    - Если при адресном чтении обнаружены устойчивые технические знания, добавь outcome-based Work Package на обновление файла инструкций агента в implementation PR этого репозитория.
    - Создай outcome-based Work Package для каждого repository-id из окончательного технического impact design.md, включая репозитории, обнаруженные на шаге планирования.
    - Для зависимого Change включи проверку зависимости и совместную Composite Verification с исходным Change.
