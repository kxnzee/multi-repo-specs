schema: spec-driven

context: |
  Первое сообщение в новом диалоге начинай на русском языке.
  Общайся с пользователем, задавай вопросы и формируй отчёты на русском языке.
  Новые текстовые артефакты также пиши на русском языке.
  Не переводи код, команды, пути, идентификаторы и обязательные машинные значения.
  Перед созданием артефакта прочитай openspec/context/00-start-here.md
  и загрузи только назначенные им файлы для текущего артефакта.
  Бизнесовые спецификации нескольких Code Repositories находятся в центральном Store Repository.
  Requirements описывают наблюдаемое поведение без деталей реализации.
  Устройство кода и устойчивые технические знания принадлежат Repository Knowledge Pack
  соответствующего Code Repository и не копируются в центральные Specs.
  Не требуй knowledge_path. Для каждого затронутого Code Repository сначала исследуй
  provider-specific каталог агента, определённый как родитель agent.commands_directory
  из sdd.yaml, и только затем используй адресное чтение исходного кода.
  Используй read-only Repository Context Pass, когда для текущего артефакта
  требуется технический контекст нескольких Code Repositories или одного крупного,
  независимая проверка вывода, разрешение противоречия либо исследование
  дополнительного зарегистрированного repository-id в прежнем бизнесовом scope.
  До создания первого Repository Context Pass в planning-сессии полностью прочитай
  openspec/context/repository-context-pass.md и следуй его обязательным условиям запуска, шаблону задания,
  контракту результата, правилам синтеза и fallback для runtime без native subagents.
  Повторно читай контракт только после потери сессии или изменения его ревизии.
  Единственный основной агент создаёт и изменяет артефакты Change.
  Master Specs меняются только командой Archive на этапе Finalization.

rules:
  proposal:
    - Укажи Jira/SberTrack key, проблему, ожидаемую ценность, границы изменения и риски совместимости.
    - Перечисли Store, Code Repositories, известные по итогам Explore как кандидаты по repository-id из sdd.yaml, и внешние системы; окончательный технический impact репозиториев определяется в design.md.
    - Во всех разделах Proposal, кроме явно отделённого evidence, описывай только наблюдаемое поведение, ценность и бизнесовые либо межсистемные границы. Не фиксируй названия файлов, каталогов, классов, функций, хуков, внутренних модулей, библиотек, команд, технологий, алгоритмы и локальные способы реализации.
    - Технические идентификаторы допустимы только в разделе источников как evidence с точной ревизией и не являются принятым решением. Отрицательный результат поиска формулируй только как ограниченное наблюдение Explore, а не как доказательство отсутствия. Открытые вопросы оставляй только для неразрешённого поведения или scope; не включай служебные действия OpenSpec и не создавай раздел, если вопросов нет.
  specs:
    - Описывай единый межрепозиторный контракт через наблюдаемые Requirements и Scenarios без деталей реализации.
    - Не упоминай файлы, классы, функции, хуки, внутренние модули, библиотеки и локальные шаги реализации.
    - Каждый Requirement и Scenario должен прямо следовать из подтверждённого Proposal и не противоречить друг другу. Не добавляй новые наблюдаемые состояния, значения, внешние системы или scope; если они необходимы, останови создание Specs и верни решение Change Owner на шаг Proposal.
  design:
    - В командном процессе design.md обязателен для каждого Change.
    - Фиксируй только межсистемный уровень — ответственность систем и repository-id, интеграции, контракты интерфейсов, владение данными, совместимость и миграцию.
    - Перечисли окончательный технический impact по repository-id и точным ревизиям всех исследованных checkout.
    - Опиши безопасный порядок слияния и развёртывания, наблюдение и стратегию отката.
    - Не копируй локальное устройство Code Repository и не указывай файлы, классы, функции, хуки, внутренние модули и конкретные библиотеки; используй найденный в каталоге агента Repository Knowledge Pack.
    - Отсутствие или неполнота Repository Knowledge Pack не блокируют Change; адресно исследуй исходный код на зафиксированной ревизии только по вопросам текущего изменения и никогда не загружай репозиторий целиком.
    - Считай блокирующим только конкретный неразрешённый факт, без которого нельзя достоверно определить межсистемный контракт, совместимость или безопасную поставку.
    - При Repository Context Pass сначала потребуй использовать Repository Knowledge Pack, затем адресное чтение кода; переноси в design.md только относящийся к Change межсистемный результат.
    - Считай репозитории Proposal кандидатами. Если subagent обнаружил дополнительный зарегистрированный repository-id с чистым checkout того же Store без изменения бизнесовых capabilities, поведения, внешних систем и scope, выполни для него отдельный pass и добавь межсистемный impact и точную ревизию в design.md без возврата в Explore.
  tasks:
    - Раздели работу на проверяемые Work Packages уровня OpenSpec Store, отдельных repository-id и межрепозиторной интеграции.
    - Представь каждый Work Package отдельным стандартным checkbox tasks.md и явно укажи одну из целей — store, конкретный repository-id либо composite-verification.
    - Для передачи реализации используй только task.id из структурированного ответа openspec instructions apply на принятом Spec Baseline; не создавай собственный формат ID и не извлекай ID из текста checkbox.
    - Включи строгую валидацию OpenSpec, компонентные и контрактные проверки, composite verification и условия Archive.
    - Описывай результат, зависимости и проверку пакета, но не файлы, классы, функции и локальные implementation steps; они принадлежат implementation PR Code Repository.
    - Если при адресном чтении обнаружены устойчивые технические знания, добавь outcome-based Work Package на обновление Repository Knowledge Pack в implementation PR этого репозитория.
    - Создай outcome-based Work Package для каждого repository-id из окончательного технического impact design.md, включая репозитории, обнаруженные на шаге планирования.
